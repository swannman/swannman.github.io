<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>915 MHz Radio Wave Propagation Simulator</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; color: #ddd; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 13px; }

/* ===== Canvas ===== */
#simCanvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

/* ===== Floating Control Panel ===== */
#controlPanel {
  position: fixed; top: 12px; left: 12px;
  background: rgba(20, 20, 30, 0.92); border: 1px solid #333; border-radius: 8px;
  padding: 14px 16px; width: 260px; z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  user-select: none;
}
#controlPanel h2 { font-size: 15px; margin-bottom: 10px; color: #8cf; letter-spacing: 0.5px; }
#controlPanel .section { margin-bottom: 12px; }
#controlPanel .section-title { font-size: 11px; text-transform: uppercase; color: #667; margin-bottom: 6px; letter-spacing: 1px; }
#controlPanel label { display: block; margin-bottom: 4px; color: #aaa; font-size: 12px; }
#controlPanel input[type="range"] { width: 100%; accent-color: #4af; }
#controlPanel .slider-row { display: flex; align-items: center; gap: 8px; }
#controlPanel .slider-row span { min-width: 55px; text-align: right; color: #8cf; font-weight: bold; font-size: 12px; }

/* Buttons */
.btn {
  display: inline-block; padding: 6px 12px; margin: 3px 2px;
  background: #1a2a3a; border: 1px solid #334; border-radius: 4px;
  color: #acd; cursor: pointer; font-size: 12px; transition: all 0.15s;
}
.btn:hover { background: #253545; border-color: #4af; color: #fff; }
.btn.active { background: #1a3a5a; border-color: #4af; color: #4af; }
.btn.danger { border-color: #a44; color: #f88; }
.btn.danger:hover { background: #3a1a1a; border-color: #f66; }

/* ===== Cursor Readout ===== */
#readout {
  position: fixed; bottom: 12px; left: 12px;
  background: rgba(20, 20, 30, 0.88); border: 1px solid #333; border-radius: 6px;
  padding: 8px 14px; z-index: 100; font-size: 12px; color: #aaa;
  font-family: 'Consolas', 'Courier New', monospace;
}
#readout .val { color: #8cf; }

/* ===== Legend ===== */
#legend {
  position: fixed; bottom: 12px; right: 12px;
  background: rgba(20, 20, 30, 0.88); border: 1px solid #333; border-radius: 6px;
  padding: 10px 14px; z-index: 100;
}
#legend .title { font-size: 11px; color: #667; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
#legendCanvas { border-radius: 3px; }
#legend .labels { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-top: 3px; }

/* ===== Scale Bar ===== */
#scaleBar {
  position: fixed; bottom: 55px; right: 12px;
  background: rgba(20, 20, 30, 0.88); border: 1px solid #333; border-radius: 6px;
  padding: 6px 14px; z-index: 100; text-align: center;
}
#scaleBar .bar { height: 3px; background: #888; border-radius: 2px; margin-bottom: 3px; }
#scaleBar .label { font-size: 10px; color: #888; }

/* ===== Status indicator ===== */
#statusBadge {
  position: fixed; top: 12px; right: 12px;
  background: rgba(20, 20, 30, 0.88); border: 1px solid #333; border-radius: 6px;
  padding: 6px 12px; z-index: 100; font-size: 11px; color: #888;
}
#statusBadge .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
#statusBadge .dot.computing { background: #fa4; animation: pulse 0.8s infinite alternate; }
#statusBadge .dot.ready { background: #4a4; }
@keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
</style>
</head>
<body>

<canvas id="simCanvas"></canvas>

<!-- Control Panel -->
<div id="controlPanel">
  <h2>915 MHz Propagation</h2>

  <div class="section">
    <div class="section-title">Transmitter</div>
    <label>Tx Power</label>
    <div class="slider-row">
      <input type="range" id="txPower" min="-10" max="40" value="20" step="1">
      <span id="txPowerVal">20 dBm</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Buildings</div>
    <button class="btn" id="btnAddBuilding">+ Add Building</button>
    <button class="btn danger" id="btnDeleteBuilding">Delete Selected</button>
  </div>

  <div class="section">
    <div class="section-title">Display</div>
    <label>Heatmap Opacity</label>
    <div class="slider-row">
      <input type="range" id="heatOpacity" min="0" max="100" value="75" step="1">
      <span id="heatOpacityVal">75%</span>
    </div>
    <label>Signal Range (dBm)</label>
    <div class="slider-row">
      <input type="range" id="sigMin" min="-120" max="-40" value="-100" step="5">
      <span id="sigMinVal">-100</span>
    </div>
    <div class="slider-row">
      <input type="range" id="sigMax" min="-60" max="20" value="-20" step="5">
      <span id="sigMaxVal">-20</span>
    </div>
  </div>

  <div class="section" style="font-size:11px; color:#556;">
    Pan: drag empty space &bull; Zoom: scroll<br>
    Click building to select, drag to move<br>
    Drag edges to resize &bull; Drag <span style="color:#fa0">&#9675;</span> to rotate<br>
    Delete / Escape to deselect
  </div>
</div>

<!-- Cursor Readout -->
<div id="readout">
  X: <span class="val" id="rdX">-</span> m &nbsp;
  Y: <span class="val" id="rdY">-</span> m &nbsp;
  Signal: <span class="val" id="rdSig">-</span> dBm
</div>

<!-- Legend -->
<div id="legend">
  <div class="title">Signal Strength (dBm)</div>
  <canvas id="legendCanvas" width="180" height="14"></canvas>
  <div class="labels"><span id="legMin">-100</span><span id="legMax">-20</span></div>
</div>

<!-- Scale Bar -->
<div id="scaleBar">
  <div class="bar" id="scaleBarBar"></div>
  <div class="label" id="scaleBarLabel">10 m</div>
</div>

<!-- Status Badge -->
<div id="statusBadge">
  <span class="dot ready" id="statusDot"></span>
  <span id="statusText">Ready</span>
</div>

<script>
// ============================================================================
// 915 MHz Radio Wave Propagation Simulator
// ============================================================================

(function() {
'use strict';

// ===== Constants =====
const FREQ = 915e6;
const C = 3e8;
const WAVELENGTH = C / FREQ;
const FSPL_CONST = 20 * Math.log10(4 * Math.PI / WAVELENGTH);
const REFLECTION_COEFF = 0.7;
const REFL_COEFF_SQ = REFLECTION_COEFF * REFLECTION_COEFF;
const MIN_BUILDING_SIZE = 2;
const EDGE_GRAB_PX = 7;
const ROT_HANDLE_OFFSET_PX = 22; // pixels above building for rotation handle
const ROT_HANDLE_RADIUS = 6;

// ===== DOM Elements =====
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const txPowerSlider = document.getElementById('txPower');
const txPowerVal = document.getElementById('txPowerVal');
const heatOpacitySlider = document.getElementById('heatOpacity');
const heatOpacityVal = document.getElementById('heatOpacityVal');
const sigMinSlider = document.getElementById('sigMin');
const sigMinVal = document.getElementById('sigMinVal');
const sigMaxSlider = document.getElementById('sigMax');
const sigMaxVal = document.getElementById('sigMaxVal');
const btnAdd = document.getElementById('btnAddBuilding');
const btnDelete = document.getElementById('btnDeleteBuilding');
const rdX = document.getElementById('rdX');
const rdY = document.getElementById('rdY');
const rdSig = document.getElementById('rdSig');
const legendCanvas = document.getElementById('legendCanvas');
const legMin = document.getElementById('legMin');
const legMax = document.getElementById('legMax');
const scaleBarBar = document.getElementById('scaleBarBar');
const scaleBarLabel = document.getElementById('scaleBarLabel');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

// ===== Application State =====
const state = {
  viewX: 0, viewY: 0, zoom: 5,
  antennaX: 0, antennaY: 0, txPower_dBm: 20,
  // Buildings: {x, y, w, h, angle} - x,y is center of bottom-left corner in unrotated local frame
  // angle in radians, rotation around center
  buildings: [],
  selectedBuilding: -1,
  mode: 'idle',
  dragStartScreenX: 0, dragStartScreenY: 0,
  dragStartWorldX: 0, dragStartWorldY: 0,
  dragBuildingOffsetX: 0, dragBuildingOffsetY: 0,
  resizeEdge: null, resizeOrigRect: null,
  rotateStartAngle: 0, rotateOrigAngle: 0,
  heatOpacity: 0.75, sigMin: -100, sigMax: -20,
  heatmapDirty: true, heatmapQuality: 'draft',
  heatmapImage: null, heatmapWorldBounds: null,
  wallSegments: [], imageSources1: [], imageSources2: [], buildingCorners: [],
  computeState: null, computeTimer: null, idleTimer: null,
};

// ===== Canvas Sizing =====
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  state.heatmapDirty = true;
  scheduleCompute('draft');
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ===== Coordinate Transforms =====
function worldToScreen(wx, wy) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  return [cx + (wx - state.viewX) * state.zoom, cy - (wy - state.viewY) * state.zoom];
}
function screenToWorld(sx, sy) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  return [state.viewX + (sx - cx) / state.zoom, state.viewY - (sy - cy) / state.zoom];
}

// ===== Building Geometry Helpers =====
function getBuildingCenter(b) {
  return [b.x + b.w / 2, b.y + b.h / 2];
}

function getBuildingCorners(b) {
  const [cx, cy] = getBuildingCenter(b);
  const hw = b.w / 2, hh = b.h / 2;
  const a = b.angle || 0;
  const cosA = Math.cos(a), sinA = Math.sin(a);
  // Local corners: BL(-hw,-hh), BR(hw,-hh), TR(hw,hh), TL(-hw,hh)
  const local = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
  return local.map(([lx, ly]) => [cx + lx * cosA - ly * sinA, cy + lx * sinA + ly * cosA]);
}

function getBuildingWalls(b) {
  const corners = getBuildingCorners(b);
  const walls = [];
  for (let i = 0; i < 4; i++) {
    const [x1, y1] = corners[i];
    const [x2, y2] = corners[(i + 1) % 4];
    const edx = x2 - x1, edy = y2 - y1;
    const len = Math.sqrt(edx * edx + edy * edy);
    if (len < 1e-6) continue;
    // Outward normal: rotate edge 90deg clockwise = (edy, -edx)
    const nx = edy / len, ny = -edx / len;
    walls.push({ x1, y1, x2, y2, nx, ny });
  }
  return walls;
}

function pointInConvexPoly(px, py, corners) {
  // Check all cross products have same sign
  const n = corners.length;
  let sign = 0;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = corners[i];
    const [x2, y2] = corners[(i + 1) % n];
    const cross = (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1);
    if (Math.abs(cross) < 1e-10) continue;
    if (sign === 0) sign = cross > 0 ? 1 : -1;
    else if ((cross > 0 ? 1 : -1) !== sign) return false;
  }
  return true;
}

// Reflect point across a line defined by a point on the line and unit normal
function reflectPoint(px, py, lx, ly, nx, ny) {
  const dot = (px - lx) * nx + (py - ly) * ny;
  return [px - 2 * dot * nx, py - 2 * dot * ny];
}

// Line-segment intersection: find t where line from (ox,oy) toward (ox+dx,oy+dy) hits segment
// Returns t (parametric on ray), or -1 if no hit. Also checks u is in [0,1] for segment.
function lineSegIntersect(ox, oy, dx, dy, sx1, sy1, sx2, sy2) {
  const ex = sx2 - sx1, ey = sy2 - sy1;
  const denom = dx * ey - dy * ex;
  if (Math.abs(denom) < 1e-12) return -1;
  const t = ((sx1 - ox) * ey - (sy1 - oy) * ex) / denom;
  const u = ((sx1 - ox) * dy - (sy1 - oy) * dx) / denom;
  if (u < -1e-6 || u > 1 + 1e-6) return -1;
  return t;
}

// ===== Scene Cache =====
function buildScene(buildings, antennaX, antennaY) {
  const walls = [];
  const corners = [];

  for (const b of buildings) {
    const bWalls = getBuildingWalls(b);
    for (const w of bWalls) walls.push(w);
    const bCorners = getBuildingCorners(b);
    for (const c of bCorners) corners.push({ x: c[0], y: c[1] });
  }

  // Compute first-order image sources (reflect antenna across each wall)
  const img1 = [];
  for (const w of walls) {
    const [ix, iy] = reflectPoint(antennaX, antennaY, w.x1, w.y1, w.nx, w.ny);
    img1.push({ x: ix, y: iy, wall: w, coeff: REFLECTION_COEFF });
  }

  // Compute second-order image sources
  const img2 = [];
  for (const src of img1) {
    for (const w of walls) {
      if (w === src.wall) continue;
      const [ix, iy] = reflectPoint(src.x, src.y, w.x1, w.y1, w.nx, w.ny);
      img2.push({ x: ix, y: iy, wall1: src.wall, wall2: w, coeff: REFL_COEFF_SQ });
    }
  }

  return { buildings, wallSegments: walls, imageSources1: img1, imageSources2: img2, buildingCorners: corners, antennaX, antennaY };
}

function rebuildSceneCache() {
  const scene = buildScene(state.buildings, state.antennaX, state.antennaY);
  state.scene = scene;
  // Backward compat: copy fields to state
  state.wallSegments = scene.wallSegments;
  state.buildingCorners = scene.buildingCorners;
  state.imageSources1 = scene.imageSources1;
  state.imageSources2 = scene.imageSources2;
}

// ===== Physics: Ray-Segment Intersection =====
function raySegIntersect(ox, oy, dx, dy, seg) {
  const sx = seg.x2 - seg.x1, sy = seg.y2 - seg.y1;
  const denom = dx * sy - dy * sx;
  if (Math.abs(denom) < 1e-12) return -1;
  const t = ((seg.x1 - ox) * sy - (seg.y1 - oy) * sx) / denom;
  const u = ((seg.x1 - ox) * dy - (seg.y1 - oy) * dx) / denom;
  if (t < 1e-6 || u < -1e-6 || u > 1 + 1e-6) return -1;
  return t;
}

// ===== Physics: Point inside any building =====
function pointInBuilding(px, py, scene) {
  const buildings = scene ? scene.buildings : state.buildings;
  for (const b of buildings) {
    if (pointInConvexPoly(px, py, getBuildingCorners(b))) return true;
  }
  return false;
}

// ===== Physics: LOS Check =====
function hasLOS(x1, y1, x2, y2, walls) {
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1e-6) return true;
  const ndx = dx / dist, ndy = dy / dist;
  const segs = walls || state.wallSegments;
  for (const seg of segs) {
    const t = raySegIntersect(x1, y1, ndx, ndy, seg);
    if (t > 0 && t < dist - 1e-4) return false;
  }
  return true;
}

// ===== Physics: FSPL =====
function fspl_dB(dist_m) {
  if (dist_m < 0.01) return 0;
  return 20 * Math.log10(dist_m) + FSPL_CONST;
}

// ===== Physics: Knife-Edge Diffraction Loss (ITU-R P.526) =====
function diffractionLoss_dB(v) {
  if (v <= -0.78) return 0;
  return 6.9 + 20 * Math.log10(Math.sqrt((v - 0.1) * (v - 0.1) + 1) + v - 0.1);
}

function computeDiffractionAtPoint(px, py, ax, ay, txPow_lin, scene) {
  const bCorners = scene ? scene.buildingCorners : state.buildingCorners;
  const walls = scene ? scene.wallSegments : state.wallSegments;
  let totalPower = 0;
  for (const corner of bCorners) {
    const d1 = Math.sqrt((corner.x - ax) ** 2 + (corner.y - ay) ** 2);
    const d2 = Math.sqrt((px - corner.x) ** 2 + (py - corner.y) ** 2);
    if (d1 < 0.1 || d2 < 0.1) continue;
    if (!hasLOS(ax, ay, corner.x, corner.y, walls)) continue;
    if (!hasLOS(corner.x, corner.y, px, py, walls)) continue;

    const directDx = px - ax, directDy = py - ay;
    const directDist = Math.sqrt(directDx * directDx + directDy * directDy);
    if (directDist < 0.1) continue;

    const h = Math.abs(directDx * (ay - corner.y) - directDy * (ax - corner.x)) / directDist;
    const v = h * Math.sqrt(2 * (d1 + d2) / (WAVELENGTH * d1 * d2));
    const totalDist = d1 + d2;
    const pathLoss = fspl_dB(totalDist);
    const diffLoss = diffractionLoss_dB(v);
    const sig_dBm = 10 * Math.log10(txPow_lin * 1000) - pathLoss - diffLoss;
    const power = Math.pow(10, sig_dBm / 10) / 1000;
    if (power > 0 && isFinite(power)) totalPower += power;
  }
  return totalPower;
}

// ===== General reflection point finder =====
// Given image source at (ix,iy), receiver at (px,py), and a wall segment,
// find reflection point on the wall and return it, or null.
function findReflectionPoint(ix, iy, px, py, w) {
  const dx = px - ix, dy = py - iy;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1e-6) return null;
  const t = lineSegIntersect(ix, iy, dx, dy, w.x1, w.y1, w.x2, w.y2);
  if (t < 1e-6 || t > 1 + 1e-6) return null;
  return [ix + t * dx, iy + t * dy];
}

// ===== Physics: Compute signal at a point =====
function computeSignalAt(px, py, maxBounces, scene, txPower_dBm) {
  const sc = scene || state.scene || null;
  const ax = sc ? sc.antennaX : state.antennaX;
  const ay = sc ? sc.antennaY : state.antennaY;
  const txPow_dBm = txPower_dBm !== undefined ? txPower_dBm : state.txPower_dBm;
  const txPow_lin = Math.pow(10, txPow_dBm / 10) / 1000;
  const walls = sc ? sc.wallSegments : state.wallSegments;
  const img1 = sc ? sc.imageSources1 : state.imageSources1;
  const img2 = sc ? sc.imageSources2 : state.imageSources2;
  const bCorners = sc ? sc.buildingCorners : state.buildingCorners;
  let totalPower = 0;

  if (!pointInBuilding(px, py, sc)) {
    const dx = px - ax, dy = py - ay;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 0.05) return txPow_dBm;

    // Direct LOS
    if (hasLOS(ax, ay, px, py, walls)) {
      const loss = fspl_dB(dist);
      totalPower += Math.pow(10, (txPow_dBm - loss) / 10) / 1000;
    }

    // First-order reflections
    if (maxBounces >= 1) {
      for (const img of img1) {
        const ridx = px - img.x, ridy = py - img.y;
        const rdist = Math.sqrt(ridx * ridx + ridy * ridy);
        if (rdist < 0.1) continue;

        const rp = findReflectionPoint(img.x, img.y, px, py, img.wall);
        if (!rp) continue;
        if (!hasLOS(ax, ay, rp[0], rp[1], walls)) continue;
        if (!hasLOS(rp[0], rp[1], px, py, walls)) continue;

        const loss = fspl_dB(rdist);
        const sig_dBm = txPow_dBm - loss + 20 * Math.log10(REFLECTION_COEFF);
        const power = Math.pow(10, sig_dBm / 10) / 1000;
        if (power > 0 && isFinite(power)) totalPower += power;
      }
    }

    // Second-order reflections
    if (maxBounces >= 2) {
      for (const img of img2) {
        const ridx = px - img.x, ridy = py - img.y;
        const rdist = Math.sqrt(ridx * ridx + ridy * ridy);
        if (rdist < 0.1) continue;

        // Find second reflection point (image -> receiver through wall2)
        const rp2 = findReflectionPoint(img.x, img.y, px, py, img.wall2);
        if (!rp2) continue;

        // Find first reflection point: reflect antenna across wall1 -> img1
        const [img1x, img1y] = reflectPoint(ax, ay, img.wall1.x1, img.wall1.y1, img.wall1.nx, img.wall1.ny);
        const rp1 = findReflectionPoint(img1x, img1y, rp2[0], rp2[1], img.wall1);
        if (!rp1) continue;

        if (!hasLOS(ax, ay, rp1[0], rp1[1], walls)) continue;
        if (!hasLOS(rp1[0], rp1[1], rp2[0], rp2[1], walls)) continue;
        if (!hasLOS(rp2[0], rp2[1], px, py, walls)) continue;

        const loss = fspl_dB(rdist);
        const sig_dBm = txPow_dBm - loss + 20 * Math.log10(REFL_COEFF_SQ);
        const power = Math.pow(10, sig_dBm / 10) / 1000;
        if (power > 0 && isFinite(power)) totalPower += power;
      }
    }

    // Diffraction
    if (maxBounces >= 2 && bCorners.length > 0) {
      totalPower += computeDiffractionAtPoint(px, py, ax, ay, txPow_lin, sc);
    }
  }

  if (totalPower <= 0) return -200;
  return 10 * Math.log10(totalPower * 1000);
}

// ===== Color Mapping =====
function signalToColor(sig_dBm, alpha) {
  const smin = state.sigMin, smax = state.sigMax;
  let t = (sig_dBm - smin) / (smax - smin);
  t = Math.max(0, Math.min(1, t));
  let r, g, b;
  if (t < 0.25) { const u = t / 0.25; r = 0; g = Math.round(u * 255); b = 255; }
  else if (t < 0.5) { const u = (t - 0.25) / 0.25; r = 0; g = 255; b = Math.round((1 - u) * 255); }
  else if (t < 0.75) { const u = (t - 0.5) / 0.25; r = Math.round(u * 255); g = 255; b = 0; }
  else { const u = (t - 0.75) / 0.25; r = 255; g = Math.round((1 - u) * 255); b = 0; }
  let a = alpha;
  if (t < 0.05) a *= t / 0.05;
  return [r, g, b, Math.round(a * 255)];
}

// ===== Colorize Signal Grid =====
function colorizeSignalGrid(signalGrid, gridW, gridH, opacity, sigMin, sigMax) {
  const offscreen = document.createElement('canvas');
  offscreen.width = gridW; offscreen.height = gridH;
  const offCtx = offscreen.getContext('2d');
  const imgData = offCtx.createImageData(gridW, gridH);
  const data = imgData.data;
  const total = gridW * gridH;
  for (let i = 0; i < total; i++) {
    const sig = signalGrid[i];
    let t = (sig - sigMin) / (sigMax - sigMin);
    t = Math.max(0, Math.min(1, t));
    let r, g, b;
    if (t < 0.25) { const u = t / 0.25; r = 0; g = Math.round(u * 255); b = 255; }
    else if (t < 0.5) { const u = (t - 0.25) / 0.25; r = 0; g = 255; b = Math.round((1 - u) * 255); }
    else if (t < 0.75) { const u = (t - 0.5) / 0.25; r = Math.round(u * 255); g = 255; b = 0; }
    else { const u = (t - 0.75) / 0.25; r = 255; g = Math.round((1 - u) * 255); b = 0; }
    let a = opacity;
    if (t < 0.05) a *= t / 0.05;
    const idx = i * 4;
    data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = Math.round(a * 255);
  }
  offCtx.putImageData(imgData, 0, 0);
  return offscreen;
}

function recolorizeHeatmap() {
  if (!state.heatmapSignalGrid) return;
  state.heatmapImage = colorizeSignalGrid(
    state.heatmapSignalGrid, state.heatmapGridW, state.heatmapGridH,
    state.heatOpacity, state.sigMin, state.sigMax
  );
  requestRender();
}

// ===== Heatmap Computation =====
function getViewBounds() {
  const [wx1, wy1] = screenToWorld(0, canvas.height);
  const [wx2, wy2] = screenToWorld(canvas.width, 0);
  const pad = 5 / state.zoom;
  return { x: wx1 - pad, y: wy1 - pad, w: (wx2 - wx1) + 2 * pad, h: (wy2 - wy1) + 2 * pad };
}

function startHeatmapCompute(quality) {

  const bounds = getViewBounds();
  let gridW, gridH, maxBounces;
  if (quality === 'draft') {
    const maxCells = 200, aspect = bounds.w / bounds.h;
    gridH = Math.min(maxCells, Math.max(40, Math.round(maxCells / Math.sqrt(aspect))));
    gridW = Math.min(300, Math.max(40, Math.round(gridH * aspect)));
    maxBounces = 1;
  } else {
    const maxCells = 360, aspect = bounds.w / bounds.h;
    gridH = Math.min(maxCells, Math.max(80, Math.round(maxCells / Math.sqrt(aspect))));
    gridW = Math.min(500, Math.max(80, Math.round(gridH * aspect)));
    maxBounces = 2;
  }
  const offscreen = document.createElement('canvas');
  offscreen.width = gridW; offscreen.height = gridH;
  const offCtx = offscreen.getContext('2d');
  const imgData = offCtx.createImageData(gridW, gridH);
  const signalGrid = new Float32Array(gridW * gridH);
  state.computeState = { quality, bounds, gridW, gridH, maxBounces, offscreen, offCtx, imgData, signalGrid, currentCell: 0, totalCells: gridW * gridH };
  setStatus('computing');
  requestAnimationFrame(processHeatmapChunk);
}

function processHeatmapChunk() {

  const cs = state.computeState;
  if (!cs) return;
  const cellsPerFrame = cs.quality === 'draft' ? 8000 : 4000;
  const end = Math.min(cs.currentCell + cellsPerFrame, cs.totalCells);
  const data = cs.imgData.data;
  const alpha = state.heatOpacity;
  for (let i = cs.currentCell; i < end; i++) {
    const gx = i % cs.gridW, gy = Math.floor(i / cs.gridW);
    const wx = cs.bounds.x + (gx + 0.5) / cs.gridW * cs.bounds.w;
    const wy = cs.bounds.y + cs.bounds.h - (gy + 0.5) / cs.gridH * cs.bounds.h;
    const sig = computeSignalAt(wx, wy, cs.maxBounces, state.scene, state.txPower_dBm);
    cs.signalGrid[i] = sig;
    const [r, g, b, a] = signalToColor(sig, alpha);
    const idx = i * 4;
    data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = a;
  }
  cs.currentCell = end;
  if (cs.currentCell >= cs.totalCells) {
    cs.offCtx.putImageData(cs.imgData, 0, 0);
    state.heatmapImage = cs.offscreen;
    state.heatmapWorldBounds = cs.bounds;
    state.heatmapQuality = cs.quality;
    state.heatmapSignalGrid = cs.signalGrid;
    state.heatmapGridW = cs.gridW;
    state.heatmapGridH = cs.gridH;
    state.computeState = null;
    state.heatmapDirty = false;
    setStatus('ready');
    requestRender();
    if (cs.quality === 'draft') {
      clearTimeout(state.idleTimer);
      state.idleTimer = setTimeout(() => { rebuildSceneCache(); startHeatmapCompute('full'); }, 300);
    }
  } else {
    cs.offCtx.putImageData(cs.imgData, 0, 0);
    state.heatmapImage = cs.offscreen;
    state.heatmapWorldBounds = cs.bounds;
    requestRender();
    requestAnimationFrame(processHeatmapChunk);
  }
}

function scheduleCompute(quality) {
  state.computeState = null;
  clearTimeout(state.idleTimer);

  rebuildSceneCache();
  if (quality === 'draft') startHeatmapCompute('draft');
  else { state.idleTimer = setTimeout(() => { rebuildSceneCache(); startHeatmapCompute('full'); }, 300); }
}

function setStatus(s) {
  if (s === 'computing') { statusDot.className = 'dot computing'; statusText.textContent = 'Computing...'; }
  else { statusDot.className = 'dot ready'; statusText.textContent = state.heatmapQuality === 'full' ? 'Ready (Full)' : 'Ready (Draft)'; }
}

// ===== Rendering =====
let renderRequested = false;
function requestRender() {
  if (!renderRequested) { renderRequested = true; requestAnimationFrame(render); }
}

function render() {
  renderRequested = false;
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawHeatmap();
  drawBuildings();
  drawAntenna();
  updateScaleBar();
}

function drawGrid() {
  const [wx1, wy1] = screenToWorld(0, canvas.height);
  const [wx2, wy2] = screenToWorld(canvas.width, 0);
  let spacing = 1;
  const ppm = state.zoom;
  if (ppm < 2) spacing = 50; else if (ppm < 5) spacing = 20; else if (ppm < 10) spacing = 10;
  else if (ppm < 25) spacing = 5; else if (ppm < 50) spacing = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.beginPath();
  const startX = Math.floor(wx1 / spacing) * spacing, startY = Math.floor(wy1 / spacing) * spacing;
  for (let wx = startX; wx <= wx2; wx += spacing) { const [sx] = worldToScreen(wx, 0); ctx.moveTo(Math.round(sx)+0.5, 0); ctx.lineTo(Math.round(sx)+0.5, canvas.height); }
  for (let wy = startY; wy <= wy2; wy += spacing) { const [,sy] = worldToScreen(0, wy); ctx.moveTo(0, Math.round(sy)+0.5); ctx.lineTo(canvas.width, Math.round(sy)+0.5); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1; ctx.beginPath();
  const [ox, oy] = worldToScreen(0, 0);
  ctx.moveTo(Math.round(ox)+0.5, 0); ctx.lineTo(Math.round(ox)+0.5, canvas.height);
  ctx.moveTo(0, Math.round(oy)+0.5); ctx.lineTo(canvas.width, Math.round(oy)+0.5);
  ctx.stroke();
}

function drawHeatmap() {
  if (!state.heatmapImage || !state.heatmapWorldBounds) return;
  const b = state.heatmapWorldBounds;
  const [sx1, sy1] = worldToScreen(b.x, b.y + b.h);
  const [sx2, sy2] = worldToScreen(b.x + b.w, b.y);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(state.heatmapImage, sx1, sy1, sx2 - sx1, sy2 - sy1);
}

function drawBuildings() {
  for (let i = 0; i < state.buildings.length; i++) {
    const b = state.buildings[i];
    const [cx, cy] = getBuildingCenter(b);
    const [scx, scy] = worldToScreen(cx, cy);
    const sw = b.w * state.zoom, sh = b.h * state.zoom;
    const a = b.angle || 0;
    const selected = i === state.selectedBuilding;

    ctx.save();
    ctx.translate(scx, scy);
    ctx.rotate(-a); // negate because screen Y is flipped

    if (selected) { ctx.fillStyle = 'rgba(80, 90, 110, 0.85)'; ctx.strokeStyle = '#4af'; ctx.lineWidth = 2; }
    else { ctx.fillStyle = 'rgba(60, 65, 80, 0.8)'; ctx.strokeStyle = '#556'; ctx.lineWidth = 1; }
    ctx.fillRect(-sw/2, -sh/2, sw, sh);
    ctx.strokeRect(-sw/2, -sh/2, sw, sh);

    // Dimension label
    if (state.zoom > 2) {
      ctx.fillStyle = '#aaa'; ctx.font = '10px Consolas, monospace'; ctx.textAlign = 'center';
      const label = `${b.w.toFixed(0)}x${b.h.toFixed(0)}m`;
      const angleLabel = a !== 0 ? ` ${(a * 180 / Math.PI).toFixed(0)}°` : '';
      ctx.fillText(label + angleLabel, 0, 3);
    }

    // Resize handles
    if (selected) {
      const hs = 4;
      ctx.fillStyle = '#4af';
      const corners = [[-sw/2,-sh/2],[sw/2,-sh/2],[sw/2,sh/2],[-sw/2,sh/2]];
      for (const [hx,hy] of corners) ctx.fillRect(hx-hs, hy-hs, hs*2, hs*2);
      ctx.fillStyle = 'rgba(68,170,255,0.7)';
      const mids = [[0,-sh/2],[0,sh/2],[-sw/2,0],[sw/2,0]];
      for (const [hx,hy] of mids) ctx.fillRect(hx-hs+1, hy-hs+1, (hs-1)*2, (hs-1)*2);
    }

    ctx.restore();

    // Rotation handle (drawn in screen space, above the building)
    if (selected) {
      // Top center of building in world coords
      const localTopX = 0, localTopY = b.h / 2;
      const cosA = Math.cos(a), sinA = Math.sin(a);
      const topWx = cx + localTopX * cosA - localTopY * sinA;
      const topWy = cy + localTopX * sinA + localTopY * cosA;
      const [topSx, topSy] = worldToScreen(topWx, topWy);

      // Offset further in the same direction (upward in local frame -> screen)
      const upDirSx = topSx - scx, upDirSy = topSy - scy;
      const upLen = Math.sqrt(upDirSx * upDirSx + upDirSy * upDirSy);
      let handleSx, handleSy;
      if (upLen > 1) {
        handleSx = topSx + (upDirSx / upLen) * ROT_HANDLE_OFFSET_PX;
        handleSy = topSy + (upDirSy / upLen) * ROT_HANDLE_OFFSET_PX;
      } else {
        handleSx = topSx;
        handleSy = topSy - ROT_HANDLE_OFFSET_PX;
      }

      // Stem line
      ctx.beginPath();
      ctx.moveTo(topSx, topSy);
      ctx.lineTo(handleSx, handleSy);
      ctx.strokeStyle = 'rgba(255, 170, 0, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Handle circle
      ctx.beginPath();
      ctx.arc(handleSx, handleSy, ROT_HANDLE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 170, 0, 0.9)';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Small rotate icon (arc arrow)
      ctx.beginPath();
      ctx.arc(handleSx, handleSy, 3.5, -0.5, Math.PI * 1.2);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
}

function drawAntenna() {
  const [sx, sy] = worldToScreen(state.antennaX, state.antennaY);
  for (let i = 3; i >= 0; i--) {
    ctx.beginPath(); ctx.arc(sx, sy, 6 + i * 5, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 100, 100, ${0.15 + i * 0.05})`; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#f44'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#f88'; ctx.font = 'bold 11px Segoe UI, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('TX', sx, sy - 28);
  ctx.fillStyle = '#aaa'; ctx.font = '10px Consolas, monospace';
  ctx.fillText(`${state.txPower_dBm} dBm`, sx, sy - 16);
}

function updateScaleBar() {
  const targetPixels = 100, meters = targetPixels / state.zoom;
  let niceMeters;
  const candidates = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  niceMeters = candidates[0];
  for (const c of candidates) if (c <= meters * 1.5) niceMeters = c;
  scaleBarBar.style.width = niceMeters * state.zoom + 'px';
  scaleBarLabel.textContent = niceMeters >= 1 ? `${niceMeters} m` : `${(niceMeters * 100).toFixed(0)} cm`;
}

// ===== Legend =====
function drawLegend() {
  const lctx = legendCanvas.getContext('2d');
  const w = legendCanvas.width, h = legendCanvas.height;
  const imgData = lctx.createImageData(w, h);
  const data = imgData.data;
  for (let x = 0; x < w; x++) {
    const sig = state.sigMin + (x / (w - 1)) * (state.sigMax - state.sigMin);
    const [r, g, b] = signalToColor(sig, 1.0);
    for (let y = 0; y < h; y++) { const idx = (y * w + x) * 4; data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255; }
  }
  lctx.putImageData(imgData, 0, 0);
  legMin.textContent = state.sigMin; legMax.textContent = state.sigMax;
}

// ===== Hit Testing =====

// Get rotation handle screen position for a building
function getRotationHandlePos(b) {
  const [cx, cy] = getBuildingCenter(b);
  const [scx, scy] = worldToScreen(cx, cy);
  const a = b.angle || 0;
  const cosA = Math.cos(a), sinA = Math.sin(a);
  const topWx = cx - (b.h / 2) * sinA;
  const topWy = cy + (b.h / 2) * cosA;
  const [topSx, topSy] = worldToScreen(topWx, topWy);
  const upDirSx = topSx - scx, upDirSy = topSy - scy;
  const upLen = Math.sqrt(upDirSx * upDirSx + upDirSy * upDirSy);
  if (upLen > 1) return [topSx + (upDirSx / upLen) * ROT_HANDLE_OFFSET_PX, topSy + (upDirSy / upLen) * ROT_HANDLE_OFFSET_PX];
  return [topSx, topSy - ROT_HANDLE_OFFSET_PX];
}

// Transform screen point to building-local screen coordinates (unrotated)
function screenToBuildingLocal(b, sx, sy) {
  const [cx, cy] = getBuildingCenter(b);
  const [scx, scy] = worldToScreen(cx, cy);
  const dx = sx - scx, dy = sy - scy;
  const a = -(b.angle || 0); // negate for screen (Y-flipped)
  const cosA = Math.cos(a), sinA = Math.sin(a);
  // Rotate (dx,dy) by +a to undo the building's screen rotation
  return [dx * cosA + dy * sinA, -dx * sinA + dy * cosA];
}

function hitTestBuildingEdge(bIdx, sx, sy) {
  if (bIdx < 0) return null;
  const b = state.buildings[bIdx];
  const [lx, ly] = screenToBuildingLocal(b, sx, sy);
  const sw = b.w * state.zoom, sh = b.h * state.zoom;
  const hw = sw / 2, hh = sh / 2;

  const nearLeft   = Math.abs(lx - (-hw)) <= EDGE_GRAB_PX;
  const nearRight  = Math.abs(lx - hw) <= EDGE_GRAB_PX;
  const nearTop    = Math.abs(ly - (-hh)) <= EDGE_GRAB_PX;
  const nearBottom = Math.abs(ly - hh) <= EDGE_GRAB_PX;
  const inX = lx >= -hw - EDGE_GRAB_PX && lx <= hw + EDGE_GRAB_PX;
  const inY = ly >= -hh - EDGE_GRAB_PX && ly <= hh + EDGE_GRAB_PX;

  if (nearLeft && nearTop) return 'tl';
  if (nearRight && nearTop) return 'tr';
  if (nearLeft && nearBottom) return 'bl';
  if (nearRight && nearBottom) return 'br';
  if (nearLeft && inY) return 'left';
  if (nearRight && inY) return 'right';
  if (nearTop && inX) return 'top';
  if (nearBottom && inX) return 'bottom';
  return null;
}

function hitTestBuildingBody(bIdx, sx, sy) {
  if (bIdx < 0) return false;
  const b = state.buildings[bIdx];
  const [lx, ly] = screenToBuildingLocal(b, sx, sy);
  const hw = b.w * state.zoom / 2, hh = b.h * state.zoom / 2;
  return lx >= -hw && lx <= hw && ly >= -hh && ly <= hh;
}

function edgeToCursor(edge) {
  if (!edge) return null;
  const map = { 'left': 'ew-resize', 'right': 'ew-resize', 'top': 'ns-resize', 'bottom': 'ns-resize',
    'tl': 'nwse-resize', 'br': 'nwse-resize', 'tr': 'nesw-resize', 'bl': 'nesw-resize' };
  return map[edge] || null;
}

// ===== Interaction: Mouse Events =====
let mouseWorldX = 0, mouseWorldY = 0;

canvas.addEventListener('mousedown', (e) => {
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);

  // Check antenna click
  const [asx, asy] = worldToScreen(state.antennaX, state.antennaY);
  if (Math.hypot(e.clientX - asx, e.clientY - asy) < 12) {
    state.mode = 'draggingAntenna';
    state.dragBuildingOffsetX = state.antennaX - wx;
    state.dragBuildingOffsetY = state.antennaY - wy;
    return;
  }

  if (state.mode === 'addBuilding') {
    const bw = 10, bh = 10;
    state.buildings.push({ x: wx - bw / 2, y: wy - bh / 2, w: bw, h: bh, angle: 0 });
    state.selectedBuilding = state.buildings.length - 1;
    state.mode = 'idle'; btnAdd.classList.remove('active'); canvas.style.cursor = 'crosshair';
    scheduleCompute('draft'); requestRender();
    return;
  }

  // Check rotation handle on selected building
  if (state.selectedBuilding >= 0) {
    const b = state.buildings[state.selectedBuilding];
    const [rhx, rhy] = getRotationHandlePos(b);
    if (Math.hypot(e.clientX - rhx, e.clientY - rhy) < ROT_HANDLE_RADIUS + 4) {
      const [cx, cy] = getBuildingCenter(b);
      state.mode = 'rotatingBuilding';
      state.rotateOrigAngle = b.angle || 0;
      state.rotateStartAngle = Math.atan2(wy - cy, wx - cx);
      return;
    }
  }

  // Check resize edge on selected building
  if (state.selectedBuilding >= 0) {
    const edge = hitTestBuildingEdge(state.selectedBuilding, e.clientX, e.clientY);
    if (edge) {
      const b = state.buildings[state.selectedBuilding];
      state.mode = 'resizingBuilding';
      state.resizeEdge = edge;
      state.resizeOrigRect = { x: b.x, y: b.y, w: b.w, h: b.h, angle: b.angle };
      state.dragStartWorldX = wx; state.dragStartWorldY = wy;
      return;
    }
  }

  // Check click on any building (using rotated geometry)
  let clickedBuilding = -1;
  for (let i = state.buildings.length - 1; i >= 0; i--) {
    if (pointInConvexPoly(wx, wy, getBuildingCorners(state.buildings[i]))) {
      clickedBuilding = i;
      break;
    }
  }

  if (clickedBuilding >= 0) {
    state.selectedBuilding = clickedBuilding;
    const b = state.buildings[clickedBuilding];
    state.mode = 'draggingBuilding';
    const [cx, cy] = getBuildingCenter(b);
    state.dragBuildingOffsetX = cx - wx;
    state.dragBuildingOffsetY = cy - wy;
    requestRender();
    return;
  }

  state.selectedBuilding = -1;
  state.mode = 'panning';
  state.dragStartScreenX = e.clientX; state.dragStartScreenY = e.clientY;
  state.dragStartWorldX = state.viewX; state.dragStartWorldY = state.viewY;
  canvas.style.cursor = 'grabbing';
  requestRender();
});

canvas.addEventListener('mousemove', (e) => {
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  mouseWorldX = wx; mouseWorldY = wy;
  rdX.textContent = wx.toFixed(1); rdY.textContent = wy.toFixed(1);

  // Signal readout
  if (state.heatmapImage && state.heatmapWorldBounds) {
    const b = state.heatmapWorldBounds;
    const gx = Math.round(((wx - b.x) / b.w) * state.heatmapImage.width);
    const gy = Math.round(((b.y + b.h - wy) / b.h) * state.heatmapImage.height);
    if (gx >= 0 && gx < state.heatmapImage.width && gy >= 0 && gy < state.heatmapImage.height) {
      const sig = computeSignalAt(wx, wy, 1, state.scene, state.txPower_dBm);
      rdSig.textContent = sig > -200 ? sig.toFixed(1) : 'N/A';
    } else rdSig.textContent = '-';
  }

  if (state.mode === 'panning') {
    const dx = (e.clientX - state.dragStartScreenX) / state.zoom;
    const dy = (e.clientY - state.dragStartScreenY) / state.zoom;
    state.viewX = state.dragStartWorldX - dx; state.viewY = state.dragStartWorldY + dy;
    requestRender();
  } else if (state.mode === 'draggingBuilding') {
    const b = state.buildings[state.selectedBuilding];
    const newCx = wx + state.dragBuildingOffsetX;
    const newCy = wy + state.dragBuildingOffsetY;
    b.x = Math.round((newCx - b.w / 2) * 2) / 2;
    b.y = Math.round((newCy - b.h / 2) * 2) / 2;
    scheduleCompute('draft'); requestRender();
  } else if (state.mode === 'draggingAntenna') {
    state.antennaX = Math.round((wx + state.dragBuildingOffsetX) * 2) / 2;
    state.antennaY = Math.round((wy + state.dragBuildingOffsetY) * 2) / 2;
    scheduleCompute('draft'); requestRender();
  } else if (state.mode === 'rotatingBuilding') {
    const b = state.buildings[state.selectedBuilding];
    const [cx, cy] = getBuildingCenter(b);
    const currentAngle = Math.atan2(wy - cy, wx - cx);
    let newAngle = state.rotateOrigAngle + (currentAngle - state.rotateStartAngle);
    // Snap to 5-degree increments
    const snap = 5 * Math.PI / 180;
    newAngle = Math.round(newAngle / snap) * snap;
    // Normalize to [-PI, PI]
    while (newAngle > Math.PI) newAngle -= 2 * Math.PI;
    while (newAngle < -Math.PI) newAngle += 2 * Math.PI;
    b.angle = newAngle;
    scheduleCompute('draft'); requestRender();
  } else if (state.mode === 'resizingBuilding') {
    const b = state.buildings[state.selectedBuilding];
    const orig = state.resizeOrigRect;
    const a = orig.angle || 0;
    const cosA = Math.cos(a), sinA = Math.sin(a);

    // Transform world delta into building-local coordinates
    const dwx = wx - state.dragStartWorldX, dwy = wy - state.dragStartWorldY;
    const dlx = dwx * cosA + dwy * sinA;   // local X delta (right)
    const dly = -dwx * sinA + dwy * cosA;  // local Y delta (up)
    const edge = state.resizeEdge;

    let nx = orig.x, ny = orig.y, nw = orig.w, nh = orig.h;
    // Compute center of original rect
    const ocx = orig.x + orig.w / 2, ocy = orig.y + orig.h / 2;

    // For resize, we adjust the building's local w/h and shift center accordingly
    let dCenterLocalX = 0, dCenterLocalY = 0;

    if (edge === 'left' || edge === 'tl' || edge === 'bl') {
      nw = orig.w - dlx;
      dCenterLocalX = dlx / 2;
    }
    if (edge === 'right' || edge === 'tr' || edge === 'br') {
      nw = orig.w + dlx;
      dCenterLocalX = dlx / 2;
    }
    if (edge === 'top' || edge === 'tl' || edge === 'tr') {
      nh = orig.h + dly;
      dCenterLocalY = dly / 2;
    }
    if (edge === 'bottom' || edge === 'bl' || edge === 'br') {
      nh = orig.h - dly;
      dCenterLocalY = -dly / 2;
    }

    if (nw < MIN_BUILDING_SIZE) nw = MIN_BUILDING_SIZE;
    if (nh < MIN_BUILDING_SIZE) nh = MIN_BUILDING_SIZE;

    // Convert local center offset to world coords
    const newCx = ocx + dCenterLocalX * cosA - dCenterLocalY * sinA;
    const newCy = ocy + dCenterLocalX * sinA + dCenterLocalY * cosA;

    b.w = Math.round(nw * 2) / 2;
    b.h = Math.round(nh * 2) / 2;
    if (b.w < MIN_BUILDING_SIZE) b.w = MIN_BUILDING_SIZE;
    if (b.h < MIN_BUILDING_SIZE) b.h = MIN_BUILDING_SIZE;
    b.x = Math.round((newCx - b.w / 2) * 2) / 2;
    b.y = Math.round((newCy - b.h / 2) * 2) / 2;

    scheduleCompute('draft'); requestRender();
  }

  // Update cursor for hover
  if (state.mode === 'idle' && state.selectedBuilding >= 0) {
    const b = state.buildings[state.selectedBuilding];
    const [rhx, rhy] = getRotationHandlePos(b);
    if (Math.hypot(e.clientX - rhx, e.clientY - rhy) < ROT_HANDLE_RADIUS + 4) {
      canvas.style.cursor = 'grab';
    } else {
      const edge = hitTestBuildingEdge(state.selectedBuilding, e.clientX, e.clientY);
      canvas.style.cursor = edgeToCursor(edge) || 'crosshair';
    }
  }
});

canvas.addEventListener('mouseup', () => {
  if (state.mode === 'panning') canvas.style.cursor = 'crosshair';
  if (state.mode === 'draggingBuilding' || state.mode === 'draggingAntenna' || state.mode === 'resizingBuilding' || state.mode === 'rotatingBuilding') {
    scheduleCompute('draft');
  }
  if (state.mode !== 'addBuilding') {
    state.mode = 'idle'; state.resizeEdge = null; state.resizeOrigRect = null;
  }
});

canvas.addEventListener('mouseleave', () => {
  if (state.mode !== 'idle' && state.mode !== 'addBuilding') {
    state.mode = 'idle'; state.resizeEdge = null; canvas.style.cursor = 'crosshair';
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const zoomFactor = e.deltaY > 0 ? 0.85 : 1.18;
  const newZoom = Math.max(0.5, Math.min(200, state.zoom * zoomFactor));
  const ratio = newZoom / state.zoom;
  state.viewX = wx - (wx - state.viewX) / ratio;
  state.viewY = wy - (wy - state.viewY) / ratio;
  state.zoom = newZoom;
  scheduleCompute('draft'); requestRender();
}, { passive: false });

// ===== Keyboard Shortcuts =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    state.selectedBuilding = -1;
    if (state.mode === 'addBuilding') { state.mode = 'idle'; btnAdd.classList.remove('active'); canvas.style.cursor = 'crosshair'; }
    requestRender();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    if (state.selectedBuilding >= 0) {
      state.buildings.splice(state.selectedBuilding, 1);
      state.selectedBuilding = -1;
      scheduleCompute('draft'); requestRender();
    }
  }
});

// ===== UI Controls =====
txPowerSlider.addEventListener('input', () => {
  state.txPower_dBm = parseInt(txPowerSlider.value);
  txPowerVal.textContent = state.txPower_dBm + ' dBm';
  scheduleCompute('draft');
});
heatOpacitySlider.addEventListener('input', () => {
  state.heatOpacity = parseInt(heatOpacitySlider.value) / 100;
  heatOpacityVal.textContent = Math.round(state.heatOpacity * 100) + '%';
  recolorizeHeatmap();
});
sigMinSlider.addEventListener('input', () => {
  state.sigMin = parseInt(sigMinSlider.value); sigMinVal.textContent = state.sigMin;
  drawLegend(); recolorizeHeatmap();
});
sigMaxSlider.addEventListener('input', () => {
  state.sigMax = parseInt(sigMaxSlider.value); sigMaxVal.textContent = state.sigMax;
  drawLegend(); recolorizeHeatmap();
});
btnAdd.addEventListener('click', () => {
  if (state.mode === 'addBuilding') { state.mode = 'idle'; btnAdd.classList.remove('active'); canvas.style.cursor = 'crosshair'; }
  else { state.mode = 'addBuilding'; btnAdd.classList.add('active'); canvas.style.cursor = 'copy'; }
});
btnDelete.addEventListener('click', () => {
  if (state.selectedBuilding >= 0) {
    state.buildings.splice(state.selectedBuilding, 1);
    state.selectedBuilding = -1;
    scheduleCompute('draft'); requestRender();
  }
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ===== Initialize =====
function init() {
  state.buildings = [
    { x: -60, y:  40, w: 40, h: 30, angle: 0 },
    { x:  30, y: -50, w: 35, h: 45, angle: 0 },
    { x:  50, y:  30, w: 30, h: 35, angle: 0 },
  ];
  state.antennaX = 0;
  state.antennaY = 0;
  state.zoom = 5;
  state.viewX = 0;
  state.viewY = 0;
  state.selectedBuilding = -1;
  state.mode = 'idle';
  scheduleCompute('draft');
  requestRender();
  drawLegend();
}
init();

window._simState = state;
window._worldToScreen = worldToScreen;

})();
</script>
</body>
</html>
